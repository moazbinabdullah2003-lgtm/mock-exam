# push to main -> build src/ -> publish dist/quiz.html on GitHub Pages (same URL as before)
name: Deploy quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build quiz.html from src/
        run: python3 build.py
      - name: Prepare site
        run: mkdir -p _site && cp dist/quiz.html _site/quiz.html && cp dist/quiz.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
