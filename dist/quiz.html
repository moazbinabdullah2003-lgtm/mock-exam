<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muaz's Classroom</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--card:#fff;--rad:16px;--p:#4f46e5;--pl:#eef2ff;--g:#16a34a;--gl:#dcfce7;--r:#dc2626;--rl:#fee2e2;--t:#111827;--m:#6b7280;--b:#e5e7eb;--bg:#f3f4f6;
  --pad:18px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);--w:760px;--btnr:12px;--hero:34px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);line-height:1.5;min-height:100vh}
body.bg-gradient{background:linear-gradient(165deg,color-mix(in srgb,var(--p) 16%,var(--bg)) 0,var(--bg) 420px) no-repeat,var(--bg)}
body.bg-dots{background-image:radial-gradient(color-mix(in srgb,var(--p) 22%,transparent) 1px,transparent 1.5px);background-size:22px 22px}
body.has-motif::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--motif);background-size:var(--msz) var(--msz);opacity:var(--mop)}
body.has-motif.in-quiz:not(.motif-quiz)::before{display:none}
body.hero-sym:not(.in-quiz) .hero{position:relative}
body.hero-sym:not(.in-quiz) .hero::after{content:var(--msym);position:absolute;right:4%;top:2px;font-size:calc(var(--hero) * 2.6);line-height:1;color:var(--p);opacity:.13;transform:rotate(-12deg);pointer-events:none;font-family:Georgia,serif;font-style:italic}
body.hero-sym .hero.left::after{right:2%}
#app{max-width:var(--w);margin:0 auto;padding:14px 16px 48px}
.card{background:var(--card);border-radius:var(--rad);padding:var(--pad);margin:14px 0;box-shadow:var(--sh);border:1px solid color-mix(in srgb,var(--t) 6%,transparent)}
h1{font-size:24px;margin:8px 0;letter-spacing:-.01em}h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}h3{font-size:15px;margin:14px 0 6px}
.muted,small{color:var(--m);font-size:13px}
.center{text-align:center}
input,select,textarea{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--b);border-radius:12px;margin:6px 0;background:var(--card);color:var(--t);font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent)}
input.bigin{font-size:22px;font-weight:700;text-align:center;letter-spacing:.06em;padding:16px}
.btn{background:var(--p);color:#fff;border:0;border-radius:var(--btnr);padding:13px 20px;font-size:15px;font-weight:650;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;box-shadow:0 2px 8px color-mix(in srgb,var(--p) 30%,transparent)}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--pl);color:var(--p);box-shadow:none}.btn.full{width:100%;margin-top:10px}.btn.red{background:var(--r)}.btn.sm{padding:8px 13px;font-size:13px}
.btn.lg{font-size:18px;padding:16px 22px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.link{background:none;border:0;color:var(--p);font-size:14px;cursor:pointer;padding:6px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0;z-index:5}
.tm{font-weight:700;font-size:18px;background:var(--card);border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums;box-shadow:var(--sh)}.tm.low{color:var(--r)}

/* hero / login */
.hero{text-align:center;padding:26px 8px 6px}
.hero .logo{font-size:calc(var(--hero) * 1.4);line-height:1;display:inline-block;width:calc(var(--hero) * 2.3);height:calc(var(--hero) * 2.3);line-height:calc(var(--hero) * 2.3);border-radius:50%;background:var(--card);box-shadow:var(--sh);margin-bottom:12px}
.hero h1{font-size:var(--hero);margin:4px 0;font-weight:800}
.hero p{color:var(--m);margin:4px 0 0;font-size:15px}
.hero.left{text-align:left}
.choices{display:grid;gap:12px;margin:18px 0}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--b);border-radius:var(--rad);padding:16px 18px;cursor:pointer;color:var(--t);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-2px);border-color:var(--p)}.choice:active{transform:scale(.98)}
.choice .ic{font-size:28px;width:52px;height:52px;border-radius:14px;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:none}
.choice b{font-size:18px;display:block}.choice small{display:block}
.choice:after{content:'›';margin-left:auto;font-size:26px;color:var(--m)}

/* big tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}
.tiles:has(>:nth-child(4)){grid-template-columns:repeat(4,1fr)}.tiles:has(>:nth-child(5)){grid-template-columns:repeat(3,1fr)}@media (max-width:560px){.tiles:has(>:nth-child(4)){grid-template-columns:1fr 1fr}.tiles:has(>:nth-child(5)){grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--card);border-radius:var(--rad);padding:14px 10px;text-align:center;box-shadow:var(--sh);border:1px solid color-mix(in srgb,var(--t) 6%,transparent)}
.tile b{display:block;font-size:28px;font-weight:800;line-height:1.15;color:var(--p)}.tile small{display:block;margin-top:2px}
.hello{font-size:22px;font-weight:800;margin:4px 0 0}

/* quiz */
.q{font-size:1.12em;font-weight:650;margin:8px 0 14px;line-height:1.55}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--b);border-radius:calc(var(--rad) - 2px);padding:13px 14px;margin:9px 0;font-size:15.5px;cursor:pointer;color:var(--t);transition:border-color .12s,background .12s,transform .1s}
.opt:hover{border-color:color-mix(in srgb,var(--p) 50%,var(--b))}.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--p);background:var(--pl)}
.opt.ok{border-color:var(--g);background:var(--gl)}.opt.bad{border-color:var(--r);background:var(--rl)}
.L{font-weight:800;min-width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--pl);color:var(--p);font-size:13px;flex:none}
.opt.sel .L{background:var(--p);color:#fff}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--b);background:var(--card);color:var(--t);font-size:14px;cursor:pointer}
.pn.done{background:var(--p);color:#fff;border-color:var(--p)}.pn.cur{outline:3px solid color-mix(in srgb,var(--p) 40%,transparent);outline-offset:1px}
.qprog{height:6px;background:var(--b);border-radius:4px;overflow:hidden;margin:4px 0 2px}.qprog i{display:block;height:100%;background:var(--p);transition:width .3s}

.stats{display:flex;gap:8px}.stat{flex:1;background:var(--pl);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.trow{display:grid;grid-template-columns:1fr 80px 46px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.hist{border-top:1px solid var(--b);padding:11px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.tag{font-size:11px;background:var(--pl);color:var(--p);border-radius:6px;padding:2px 7px;margin-left:4px;font-weight:600}
.tr{display:flex;align-items:flex-end;gap:4px;height:80px}.tr div{flex:1;border-radius:6px 6px 0 0;min-width:8px;background:var(--p);position:relative}
.err{color:var(--r);font-size:14px;margin:6px 0}.warn{background:#fef9c3;color:#713f12;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.big{font-size:52px;font-weight:850;color:var(--p);text-align:center;margin:0;line-height:1.1}
.exp{background:color-mix(in srgb,var(--t) 5%,var(--card));border-radius:10px;padding:10px 12px;font-size:14px;margin-top:6px;line-height:1.7}
.katex{font-size:1.05em}.opt .katex-display,.exp .katex-display{margin:.4em 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-weight:600}
td.h{text-align:center;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fade .2s}
.modal .card{max-width:400px;width:100%;animation:pop .22s ease}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pl)}

.notice{border-radius:var(--rad);padding:12px 14px;margin:10px 0;font-size:14px;background:var(--pl);color:var(--t);border-left:4px solid var(--p)}
.notice.warn{background:#fef9c3;color:#713f12;border-color:#eab308}.notice.good{background:var(--gl);border-color:var(--g)}.notice.bad{background:var(--rl);border-color:var(--r)}
.foot{text-align:center;color:var(--m);font-size:12px;margin:28px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding:4px;background:var(--card);border-radius:calc(var(--rad) - 2px);box-shadow:var(--sh)}
.tabs button{flex:1;white-space:nowrap;background:transparent;color:var(--t);border:0;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--p);color:#fff}

/* collapsible sections */
details.sec{background:var(--card);border-radius:var(--rad);margin:12px 0;box-shadow:var(--sh);border:1px solid color-mix(in srgb,var(--t) 6%,transparent);overflow:hidden}
details.sec>summary{padding:16px 18px;font-weight:700;font-size:1.02em;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sub{margin-left:auto;white-space:nowrap;font-weight:500;font-size:13px;color:var(--m)}
details.sec>summary:after{content:'';width:9px;height:9px;border-right:2px solid var(--m);border-bottom:2px solid var(--m);transform:rotate(45deg);transition:transform .25s;margin-left:8px;flex:none}
details.sec:not(:has(.sub))>summary:after{margin-left:auto}
details.sec[open]>summary:after{transform:rotate(-135deg)}
details.sec>summary:hover{background:color-mix(in srgb,var(--p) 5%,transparent)}
details.sec>.in{padding:0 18px 18px}
details.sec[open]>.in{animation:slide .3s ease}

.fld{display:block;margin:10px 0}.fld>span{display:block;font-size:13px;color:var(--m);margin-bottom:2px}
.fld input[type=color]{padding:2px;height:42px;width:100%}.fld input[type=range]{padding:0;accent-color:var(--p)}
.chk{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px}.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--p)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.sw button{border:2px solid var(--b);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;color:#fff;font-weight:600}
.savebar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0;z-index:6}
.qed{border:1px solid var(--b);border-radius:var(--rad);padding:12px;margin:10px 0;background:var(--card)}
.qed .pv{background:color-mix(in srgb,var(--t) 5%,var(--card));border-radius:8px;padding:8px;margin:6px 0;font-size:.95em}
.oe{display:flex;gap:6px;align-items:center}.oe input[type=radio]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--p)}
.oe input[type=text]{margin:3px 0}
.stats.w{flex-wrap:wrap}.stats.w .stat{flex:1 1 30%;min-width:90px}
.kbhint{font-size:12px;color:var(--m);margin:8px 0 2px}@media (hover:none){.kbhint{display:none}}
.tbar{height:8px;background:var(--b);border-radius:5px;overflow:hidden;margin-top:4px}.tbar i{display:block;height:100%;background:var(--p)}

/* animation (teacher can switch off: theme.anim) */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
html.anim #app.enter>*{animation:up .4s cubic-bezier(.2,.7,.3,1) both}
html.anim #app.enter>*:nth-child(2){animation-delay:.05s}html.anim #app.enter>*:nth-child(3){animation-delay:.1s}
html.anim #app.enter>*:nth-child(4){animation-delay:.15s}html.anim #app.enter>*:nth-child(5){animation-delay:.2s}
html.anim #app.enter>*:nth-child(n+6){animation-delay:.25s}
html:not(.anim) *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.hero{padding-top:16px}.tile b{font-size:24px}.big{font-size:44px}}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.thm{display:block;text-align:left;background:var(--card);border:2px solid var(--b);border-radius:14px;padding:8px;cursor:pointer;color:var(--t);transition:transform .15s,border-color .15s}
.thm:hover{transform:translateY(-2px)}.thm.on{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 20%,transparent)}
.thm b{display:block;font-size:14px;margin-top:6px}.thp{position:relative;overflow:hidden}.thp>div{position:relative}.thh{margin:14px 0 0;font-size:15px}.thd{display:flex;gap:4px;margin-top:6px}.thd i{width:14px;height:14px;border-radius:50%;display:block}.thm small{display:block;font-size:12px}
.thp{padding:10px}.thp>div{display:flex;align-items:center;justify-content:space-between;padding:10px}.thp>div b{margin:0;font-size:18px}.thp>div span{display:block;width:42px;height:16px}.thp.mo{padding:30px 22px 10px}.thp.mo>div{padding:7px 10px}

/* 🎨 Colorful boxes (theme.boxStyle) + symbol texture inside boxes (theme.boxSym). --cc = this box's color */
:root{--c1:var(--p);--c2:#0ea5e9;--c3:#f59e0b;--c4:#ec4899;--bop:.3}
:is(.card,.tile,.choice,details.sec){--cc:var(--c1)}
body.box-rainbow :is(.tile,.choice):nth-child(4n+2),body.box-rainbow :is(.card,details.sec):nth-of-type(4n+2){--cc:var(--c2)}
body.box-rainbow :is(.tile,.choice):nth-child(4n+3),body.box-rainbow :is(.card,details.sec):nth-of-type(4n+3){--cc:var(--c3)}
body.box-rainbow :is(.tile,.choice):nth-child(4n+4),body.box-rainbow :is(.card,details.sec):nth-of-type(4n+4){--cc:var(--c4)}
body:is(.box-tint,.box-rainbow,.box-bold) :is(.card,.tile,.choice,details.sec){background:linear-gradient(150deg,color-mix(in srgb,var(--cc) 15%,var(--card)) 0,var(--card) 75%);border-color:color-mix(in srgb,var(--cc) 32%,var(--b));border-top:3px solid var(--cc)}
body:is(.box-tint,.box-rainbow) .tile b{color:var(--cc)}
body:is(.box-tint,.box-rainbow,.box-bold) .choice .ic{background:color-mix(in srgb,var(--cc) 22%,var(--card))}
body:is(.box-tint,.box-rainbow,.box-bold) .choice:hover{border-color:var(--cc)}
body:is(.box-tint,.box-rainbow,.box-bold) .hero .logo{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c2) 30%,var(--card)),var(--card) 70%);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 35%,transparent),var(--sh)}
body:is(.box-tint,.box-rainbow,.box-bold) .tabs button.on{background:linear-gradient(135deg,var(--c1),var(--c2))}
body:is(.box-tint,.box-rainbow,.box-bold) .L{background:color-mix(in srgb,var(--c2) 18%,var(--card));color:var(--c2)}
/* bold = tile আর choice-এর icon পুরো রঙিন (lekha card-এর রঙে: light theme-এ সাদা, dark theme-এ গাঢ়) */
body.box-bold :is(.tile,.choice):nth-child(4n+2){--cc:var(--c2)}body.box-bold :is(.tile,.choice):nth-child(4n+3){--cc:var(--c3)}body.box-bold :is(.tile,.choice):nth-child(4n+4){--cc:var(--c4)}
body.box-bold .tiles>.tile{background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 72%,#000));border-color:transparent}
body.box-bold .tiles>.tile :is(b,small){color:var(--card)!important}
body.box-bold .choice .ic{background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 72%,#000))}
/* box-এর ভেতরে symbol (কোণার দিকে, লেখার জায়গা পরিষ্কার) */
body.box-sym :is(.card,.tile,.choice,details.sec){position:relative;isolation:isolate}
body.box-sym :is(.card,.tile,.choice,details.sec)::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background-image:var(--motif);background-size:calc(var(--msz) * .7) calc(var(--msz) * .7);opacity:var(--bop);-webkit-mask-image:linear-gradient(125deg,transparent 30%,#000 95%);mask-image:linear-gradient(125deg,transparent 30%,#000 95%)}
body.box-bold.box-sym .tile::before{filter:brightness(0) invert(1);opacity:calc(var(--bop) * .8)}
body.box-sym.in-quiz:not(.motif-quiz) :is(.card,.tile,.choice,details.sec)::before{display:none}
.bnx{margin:8px 0;border:1px dashed var(--b);border-radius:10px;padding:6px 10px}.bnx>summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   CONFIG  (teacher only edits this part)
   ============================================================ */
const CONFIG = {
  // RECOMMENDED: Google Apps Script Web App URL (Code.gs deploy করার পর যে /exec link পাবে)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx2xuErMRJf9XPij0Yt28hqLXf79oAN3MnQva2ERw4rTJLQsFrkmQwO6qpFxTCG3IRPjw/exec",
  // (পুরোনো Form পদ্ধতি — SCRIPT_URL থাকলে দরকার নেই) Google Form "Get pre-filled link" (see setup steps). Dummy values must be: SID,NAME,EXAM,AID,MODE,SCORE,TOTAL,SECS,DETAILS
  PREFILLED_LINK: "",
  // Google Sheet -> File -> Share -> Publish to web -> (Form Responses sheet) -> CSV -> paste link
  SHEET_CSV_URL: "",
  TEACHER_PASS: "teacher123"
};

/* Exam code (UPPERCASE) -> exam.
   minutes: timer | neg: negative mark per wrong (0 = none) | shuffle: question order random | open:false = close the exam
   Question: q = text, o = options, a = correct option index (0 = first), t = topic, e = explanation (optional) */
const EXAMS = {
  "DEMO1": {
    title: "Demo Mock Test", minutes: 5, neg: 0, shuffle: true, open: true,
    questions: [
      {q:"2x + 3 = 11 হলে x = ?", o:["2","3","4","5"], a:2, t:"Algebra", e:"2x = 8, x = 4"},
      {q:"sin 30° = ?", o:["1/2","√3/2","1","0"], a:0, t:"Trigonometry", e:"sin 30° = 1/2"},
      {q:"d/dx (x²) = ?", o:["x","2x","x²","2"], a:1, t:"Calculus", e:"Power rule"},
      {q:"x² − 5x + 6 = 0 এর roots কী?", o:["1,6","2,3","−2,−3","−1,6"], a:1, t:"Algebra", e:"(x−2)(x−3)=0"},
      {q:"cos 0° = ?", o:["0","1/2","1","−1"], a:2, t:"Trigonometry", e:"cos 0° = 1"},
      {q:"∫ 2x dx = ?", o:["x²+C","2x²+C","x+C","2+C"], a:0, t:"Calculus", e:"∫2x dx = x² + C"}
    ]
  }
};

/* ============================================================
   Helpers
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g,'<br>');

function parseCSV(t, d){
  d = d || ',';
  const rows=[]; let r=[], c='', q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===d){ r.push(c); c=''; }
    else if(ch==='\n'){ r.push(c); rows.push(r); r=[]; c=''; }
    else if(ch!=='\r') c+=ch;
  }
  if(c!==''||r.length){ r.push(c); rows.push(r); }
  return rows;
}

const MOTIF_SHAPES = {

const motifEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* একটা repeat-হওয়া tile (W×W px) এর SVG — একই input দিলে সবসময় একই ছবি (seeded) */
function motifSVG(kind, color){
  const m = MOTIFS[kind];
  if(!m || kind === 'none') return '';
  const W = 264, N = 4, cell = W / N, rnd = motifRng(kind.length * 977 + kind.charCodeAt(0) * 31);
  let body = '';
  if(m.grid){
    let g = '';
    for(let i = 0; i < W; i += 11) g += `<path d="M${i},0V${W}M0,${i}H${W}" stroke-width="${i % 66 ? .5 : 1.1}" stroke-opacity="${i % 66 ? .45 : .9}"/>`;
    body += `<g stroke="${color}" fill="none">${g}</g>`;
  }
  const font = m.it ? 'Georgia,Cambria,serif' : 'Arial,Helvetica,sans-serif';   // quote রাখা যাবে না (data URL ভেঙে যায়)
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
    if(m.grid && rnd() < .45) continue;            // grid motif-এ কম জিনিস
    const x = c * cell + cell / 2 + (rnd() - .5) * cell * .3, y = r * cell + cell / 2 + (rnd() - .5) * cell * .3;
    const rot = Math.round((rnd() - .5) * 40);
    const useShape = m.sh && m.sh.length && (!m.s.length || rnd() < (m.shp || .38));
    if(useShape){
      const sh = m.sh[Math.floor(rnd() * m.sh.length)], sc = .8 + rnd() * .35;
      body += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${sh === 'elem' ? 0 : rot}) scale(${sc.toFixed(2)})">${MOTIF_SHAPES[sh](color, 20, rnd)}</g>`;
    } else {
      const t = m.s[Math.floor(rnd() * m.s.length)], fs = Math.round(14 + rnd() * 9 - Math.max(0, t.length - 4) * 1.2);
      body += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})" font-size="${fs}" ${m.it ? 'font-style="italic"' : ''} text-anchor="middle" dominant-baseline="middle" fill="${color}" font-family="${font}">${motifEsc(t)}</text>`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">${body}</svg>`;
}
const MOTIF_CACHE = {};
function motifURL(kind, color){
  const k = kind + '|' + color;
  if(!(k in MOTIF_CACHE)){ const s = motifSVG(kind, color); MOTIF_CACHE[k] = s ? `url("data:image/svg+xml,${encodeURIComponent(s).replace(/'/g, '%27')}")` : 'none'; }
  return MOTIF_CACHE[k];
}

/* ============================================================
   Network helper: timeout + আসল error-এর কারণ আলাদা করে বোঝা
   ============================================================ */
const INAPP = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|Telegram|; wv\)/i;
/* GET url -> parsed JSON. Throws {kind:'timeout'|'offline'|'http'|'badresp'|'blocked', detail} */
async function jget(url, ms){
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = ac ? setTimeout(() => ac.abort(), ms || 20000) : null;
  let res;
  try{ res = await fetch(url, ac ? {signal: ac.signal} : undefined); }
  catch(e){
    if(tm) clearTimeout(tm);
    if(e && e.name === 'AbortError') throw {kind:'timeout', detail:'no response in ' + Math.round((ms || 20000) / 1000) + 's'};
    if(typeof navigator !== 'undefined' && navigator.onLine === false) throw {kind:'offline', detail:'navigator.onLine=false'};
    throw {kind:'blocked', detail:String(e && e.message || e)};
  }
  if(tm) clearTimeout(tm);
  if(!res.ok) throw {kind:'http', detail:'HTTP ' + res.status};
  const txt = await res.text();
  try{ return JSON.parse(txt); }
  catch(e){ throw {kind:'badresp', detail:txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80)}; }
}
function describeErr(e){
  const k = e && e.kind, ua = typeof navigator !== 'undefined' ? navigator.userAgent : '';
  const tail = '\n[' + (k || 'error') + ': ' + (e && e.detail || e && e.message || e) + ']';
  if(k === 'offline') return 'Internet connection নেই। WiFi / mobile data চালু করে আবার try করো।' + tail;
  if(k === 'timeout') return 'Server সাড়া দিচ্ছে না (অনেক ধীর internet বা block)। একটু পরে আবার try করো, অথবা WiFi ↔ mobile data বদলাও।' + tail;
  if(k === 'http') return 'Server সমস্যা দিচ্ছে। একটু পরে আবার try করো।' + tail;
  if(k === 'badresp') return 'Server ভুল response দিয়েছে (অস্থায়ী সমস্যা হতে পারে)। একটু পরে আবার try করো।' + tail;
  return 'Server-এ পৌঁছানো যাচ্ছে না। ' + (INAPP.test(ua) ? 'তুমি Messenger/Facebook-এর ভেতরের browser-এ আছো — Chrome বা Safari-তে link খোলো। ' : 'WiFi ↔ mobile data বদলে দেখো; VPN / ad-blocker / Brave Shields বন্ধ করো।') + tail;
}
let NETERR = '', LASTERR = null, DIAG = '';

const qinfo = (exam, i) => EXAMS[exam] && EXAMS[exam].questions[i];
function topicStats(recs){
  const m = {};
  recs.forEach(r => r.d.forEach(([i,c,ok]) => {
    const q = qinfo(r.exam, i), t = (q && q.t) || 'General';
    const o = m[t] = m[t] || {t, n:0, ok:0};
    o.n++; o.ok += ok ? 1 : 0;
  }));
  return Object.values(m).map(x => ({...x, p: x.ok / x.n})).sort((a,b) => a.p - b.p);
}
function wrongIdx(sid, exam){
  const st = {};
  allRecs().filter(r => norm(r.sid) === norm(sid) && r.exam === exam).forEach(r => r.d.forEach(([i,c,ok]) => { st[i] = ok; }));
  return Object.keys(st).filter(i => !st[i]).map(Number);
}

/* প্রতি question-এ কত সময় গেছে (শুধু যেগুলোতে ≥1s ছিল): avg/max/accuracy */
function qTimeStats(recs){
  const m = {};
  recs.forEach(r => r.d.forEach(([i, c, ok, s]) => {
    if(!(s > 0)) return;
    const k = r.exam + '|' + i, o = m[k] = m[k] || {exam:r.exam, i, n:0, sum:0, max:0, ok:0};
    o.n++; o.sum += s; o.max = Math.max(o.max, s); if(c >= 0 && ok) o.ok++;
  }));
  return Object.values(m).filter(o => qinfo(o.exam, o.i)).map(o => ({...o, avg:o.sum / o.n}));
}

const RUNKEY = (sid, exam, mode) => norm(sid) + '_' + exam + '_' + mode;
function startRun(exam, mode, idxs, lang){
  const e = EXAMS[exam];
  applyOv(e, exam);
  if(isBi(e) && !lang){ LANGASK = {exam, mode, idxs}; return render(true); }   // আগে ভাষা বেছে নাও
  let order = idxs && idxs.length ? idxs.slice() : e.questions.map((_, i) => i);
  /* সবসময় shuffle (settings দিয়ে বন্ধ করা যায় না): প্রতি attempt-এ question order আর option order নতুন করে এলোমেলো।
     একই student-এর আগের attempt-এর সাথে question order হুবহু এক হলে আবার shuffle করা হয়। */
  shuffle(order);
  const lk = 'mq_lo_' + RUNKEY(SESS.sid, exam, mode), prev = LS.get(lk, null);
  for(let k = 0; k < 20 && order.length > 1 && prev && prev.join() === order.join(); k++) shuffle(order);
  LS.set(lk, order);
  const op = {};
  /* "None of these / All of the above / Both…" option সবসময় শেষে থাকে, বাকিগুলো shuffle হয় */
  const PIN = /^\s*(none of (these|the above)|all of (these|the above)|both\b|উপরের সবগুলো|কোনোটিই নয়)/i;
  order.forEach(qi => {
    const pin = [], mv = [];
    e.questions[qi].o.forEach((t, i) => (PIN.test(t) ? pin : mv).push(i));
    op[qi] = shuffle(mv).concat(pin);
  });
  const perQ = e.minutes * 60 / e.questions.length;
  const dur = mode === 'mistakes' ? Math.max(60, Math.ceil(order.length * perQ)) : e.minutes * 60;
  RUN = {sid:SESS.sid, name:SESS.name, exam, mode, order, op, ans:{}, secs:{}, cur:0, start:Date.now(), dur, last:Date.now(), lang:lang || 'en'};
  LS.set('mq_run', RUN); confirming = false; view = 'quiz'; render(); startTimer();
}
function retake(exam, mode){
  const e = EXAMS[exam];
  if(!e) return;
  if(mode === 'mistakes'){
    const w = wrongIdx(SESS.sid, exam);
    if(!w.length){ msg = 'কোনো ভুল নেই 🎉'; return render(); }
    startRun(exam, 'mistakes', w);
  } else {
    const why = canStart(exam);
    if(why){ msg = why; view = 'home'; return render(); }
    startRun(exam, 'full');
  }
}

const dShort = aid => new Date(aidTime(aid)).toLocaleDateString(undefined, {day:'numeric', month:'short'});
const dLong = aid => new Date(aidTime(aid)).toLocaleString(undefined, {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
/* recent avg − earlier avg (in %-points); null if <2 attempts */
function trendOf(ps){
  const n = ps.length; if(n < 2) return null;
  const k = Math.min(3, n - 1);
  return avg(ps.slice(-k)) - avg(ps.slice(0, n - k));
}
const trendTag = d => d === null ? '–' : d >= 5 ? '<span style="color:var(--g)">▲ +' + d + '</span>' : d <= -5 ? '<span style="color:var(--r)">▼ ' + d + '</span>' : '<span class="muted">▬ ' + (d > 0 ? '+' : '') + d + '</span>';
function vProfile(sid){
  const all = allRecs(), recs = all.filter(r => norm(r.sid) === norm(sid));
  let h = '';

/* ---------- ⏱ Time analytics block (used on every analytics page) ----------

const secS = s => s >= 60 ? Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's' : Math.round(s) + 's';
function topicTime(recs){

function stuTime(recs){

  const byEx = {}; qt.forEach(o => { (byEx[o.exam] = byEx[o.exam] || []).push(o); });

        <div style="font-size:14px">${esc(q.q)}</div>${bar(o.avg, mx, slow ? (a < 0.5 ? 'var(--r)' : '#f59e0b') : '')}

      </table></div><small class="muted">সবচেয়ে ধীর student উপরে · নামে tap করলে profile</small>`, st.length + '');
  }

    <small class="muted">Student কোন question screen-এ কতক্ষণ ছিল — background-এ গোনা হয়।</small>
    ${sec(id + '_t', '🎯 Topic-wise time', tHtml, tt.length + ' topic')}
    ${sec(id + '_q', '❓ Question-wise time (exam অনুযায়ী, ধীর আগে)', qHtml, qt.length + ' Q')}
    ${sHtml}`;
  return sec(id, '⏱ Time analytics', body, 'গড় ' + secS(overall) + '/Q');
}

/* Keyboard: 1..N = option (দেখানো position), Enter = save & next (শেষ question-এ submit confirm), ← → = prev/next */

/* ---------- 📋 Copy for AI: exam / one question as clean Markdown + LaTeX ($…$), with answers + our solution ----------

function copyText(t, btn){
  const done = ok => {
    if(btn){ const o = btn.textContent; btn.textContent = ok ? '✅ Copied!' : '⚠ Copy হয়নি'; setTimeout(() => { btn.textContent = o; }, 1800); }
  };

    try{ const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); done(ok); }catch(e){ done(false); }

/* one question block. c = student's chosen ORIGINAL index (-1 skipped, undefined = no student), lv = 'full'|'marks' */
function aiQ(q, n, c, lv, withExp){
  let s = `### Question ${n} (Topic: ${q.t || 'General'})\n${String(q.q).trim()}\n\n` + q.o.map((o, i) => `${LET[i]}) ${String(o).trim()}`).join('\n') + '\n';
  if(c !== undefined) s += `\nMy answer: ${c < 0 ? 'Skipped (did not answer)' : LET[c] + ') ' + String(q.o[c]).trim()}` + (lv === 'marks' && c >= 0 ? (c === q.a ? ' — ✅ correct' : ' — ❌ wrong') : '') + '\n';
  if(lv === 'full') s += `Correct answer: ${LET[q.a]}) ${String(q.o[q.a]).trim()}` + (c !== undefined && c >= 0 ? (c === q.a ? '  ✅ (I got it right)' : '  ❌ (I got it wrong)') : '') + '\n';

function aiHead(e, code, who){

    : `I am a student. Below is an MCQ exam I took, with my answers${who === 'full' ? ', the correct answers and my teacher\'s solutions' : ''}. ${AI_NOTE}\nPlease explain step by step why the correct answer is right, why my wrong answers are wrong, what concept I am missing, and give me 2 similar practice questions for my weak areas. Answer in simple language (Bangla/English mix is fine).\n\n# ${e.title || code} (${code})\n\n`;

function parseQ(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  if(typeof isMD === 'function' && isMD(text)) return parseMD(text);   // Markdown + LaTeX format (11a)
  const errs = [];
  if(text.indexOf('\uFFFD') >= 0) errs.push('Bengali লেখা ভেঙে গেছে — CSV "UTF-8" format-এ save করো।');
  const first = text.split('\n')[0] || '';
  const delim = first.split('\t').length > first.split(',').length ? '\t' : ',';
  const rows = parseCSV(text, delim);
  if(!rows.length || rows.length < 2) return {errors:['ফাঁকা বা শুধু header আছে'], exams:{}};
  const H = rows[0].map(x => String(x).trim().toUpperCase()), ix = k => H.indexOf(k);
  ['Q','A','B','ANS'].forEach(k => { if(ix(k) < 0) errs.push('Header-এ "' + k + '" column নেই'); });
  if(errs.length) return {errors:errs, exams:{}};
  const exams = {}; let code = '';
  rows.slice(1).forEach((r, n) => {
    const g = k => { const j = ix(k); return j >= 0 && r[j] != null ? String(r[j]).trim() : ''; };
    const rn = n + 2;
    if(!g('Q') && !g('A') && !g('B')) return;
    const c = (g('CODE') || code).toUpperCase();
    if(!c){ errs.push('Row ' + rn + ': CODE নেই'); return; }
    code = c;
    if(!g('Q')){ errs.push('Row ' + rn + ': Question লেখা নেই'); return; }
    const opts = ['A','B','C','D','E'].map(g); let last = opts.length;
    while(last > 0 && !opts[last-1]) last--;
    const o = opts.slice(0, last);
    if(o.length < 2 || o.some(x => !x)){ errs.push('Row ' + rn + ': Option ঠিক নেই (অন্তত ২টা, মাঝে ফাঁকা নয়)'); return; }
    const a = 'ABCDE'.indexOf(g('ANS').toUpperCase());
    if(g('ANS').length !== 1 || a < 0 || a >= o.length){ errs.push('Row ' + rn + ': ANS ভুল ("' + g('ANS') + '")'); return; }
    const ex = exams[c] = exams[c] || {code:c, rows:[]};
    if(!ex.rows.length){ ex.title = g('TITLE') || c; ex.minutes = g('MINUTES') || '10'; ex.neg = g('NEG') || '0'; ex.open = g('OPEN').toUpperCase() === 'NO' ? 'NO' : 'YES';
      const raw = {}; RULE_KEYS.forEach(k => { if(ix(k) >= 0) raw[k] = g(k); }); ex.ov = readRules(raw, 'Row ' + rn + ' (' + c + ')', errs); }
    const row = {q:g('Q'), o, a, t:g('TOPIC') || 'General', e:g('EXPLANATION')};
    const be = bnErr(g('Q_BN'), ['A','B','C','D','E'].map(k => g(k + '_BN')), g('EXPLANATION_BN'), o.length, row);
    if(be){ errs.push('Row ' + rn + ': ' + be); return; }
    ex.rows.push(row);
  });
  if(!Object.keys(exams).length && !errs.length) errs.push('কোনো valid question পাওয়া যায়নি');
  return {errors:errs, exams};
}

/* Exam rules (per-exam override, CFG.exams[code]) from upload: MAXATTEMPTS, GUEST, START, END, INTRO.
   raw = {MAXATTEMPTS:'1', ...} (only keys the file has). কোনো rule key না থাকলে null (আগের rule যেমন আছে থাকবে). */
const RULE_KEYS = ['MAXATTEMPTS', 'GUEST', 'START', 'END', 'INTRO'];
function upDate(v, end){
  v = String(v || '').trim(); if(!v) return '';
  const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?$/);
  if(!m) return null;
  const p = n => String(n).padStart(2, '0'), s = `${m[1]}-${p(m[2])}-${p(m[3])}T${m[4] != null ? p(m[4]) + ':' + m[5] : (end ? '23:59' : '00:00')}`;
  return isNaN(new Date(s).getTime()) ? null : s;
}
function readRules(raw, lab, errs){
  if(!raw || !RULE_KEYS.some(k => k in raw)) return null;
  const ov = {}, g = k => String(raw[k] == null ? '' : raw[k]).trim();
  const ma = g('MAXATTEMPTS');
  if(ma && !/^\d+$/.test(ma)) errs.push(lab + ': MAXATTEMPTS শুধু সংখ্যা ("' + ma + '")'); else ov.maxAttempts = Number(ma || 0);
  const gu = g('GUEST').toUpperCase();
  if(gu && gu !== 'YES' && gu !== 'NO') errs.push(lab + ': GUEST হবে YES / NO / ফাঁকা ("' + g('GUEST') + '")'); else ov.guest = gu === 'YES' ? 'yes' : gu === 'NO' ? 'no' : '';
  const st = upDate(g('START')), en = upDate(g('END'), true);
  if(st === null) errs.push(lab + ': START-এর format হবে 2026-11-20 10:00 ("' + g('START') + '")'); else ov.start = st;
  if(en === null) errs.push(lab + ': END-এর format হবে 2026-11-20 11:00 ("' + g('END') + '")'); else ov.end = en;
  if(st && en && new Date(en) <= new Date(st)) errs.push(lab + ': END সময় START-এর পরে হতে হবে');
  ov.intro = g('INTRO');
  return ov;
}
const rulesTxt = ov => !ov ? 'Rules: আগের মতো (file-এ নেই)' : 'Rules: ' + [ov.maxAttempts ? 'max ' + ov.maxAttempts + ' attempt' : 'attempt: global', ov.guest === 'yes' ? 'guest ✓' : ov.guest === 'no' ? 'guest ✗' : 'guest: global',
  ov.start || ov.end ? '🕒 ' + (ov.start ? ov.start.replace('T', ' ') : '…') + ' → ' + (ov.end ? ov.end.replace('T', ' ') : '…') : 'সময়-সীমা নেই', ov.intro ? 'instructions ✓' : 'instructions নেই'].join(' · ');

/* বাংলা version check + row-এ বসানো. বাংলা option ফাঁকা থাকলে English দেখাবে (সংখ্যা/সূত্র হলে একই থাকে) */
function bnErr(qb, ob, eb, n, row){
  qb = String(qb || '').trim(); ob = (ob || []).map(x => String(x == null ? '' : x).trim()); eb = String(eb || '').trim();
  if(!qb) return ob.some(Boolean) || eb ? 'বাংলা option/solution আছে কিন্তু বাংলা প্রশ্ন (Q_BN / [BN] Q:) নেই' : '';
  if(ob.slice(n).some(Boolean)) return 'বাংলা option English option-এর চেয়ে বেশি';
  row.qb = qb; row.ob = Array.from({length:n}, (_, i) => ob[i] || ''); row.eb = eb;
  return '';
}

/* MD detection: "# EXAM:" line or "## Q" + "ANS:" lines. AI-র ```markdown fence থাকলেও চলবে */
const isMD = t => /^\s*#\s*EXAM\s*:/mi.test(t) || (/^\s*##\s*Q\s*\d*/mi.test(t) && /^\s*ANS\s*:/mi.test(t));
function parseMD(text){
  const lines = String(text || '').replace(/^﻿/, '').replace(/\r/g, '').split('\n');
  const errs = [], exams = {};
  let ex = null, q = null, field = null, qn = 0;
  const finish = () => {
    if(!q) return;
    const lab = 'Q' + q.n + (ex ? ' (' + ex.code + ')' : '');
    const o = q.o.map(s => s.trim());
    if(!ex){ errs.push(lab + ': উপরে "# EXAM: CODE" লাইন নেই'); }
    else if(!q.q.trim()) errs.push(lab + ': Question (Q:) লেখা নেই');
    else if(o.length < 2 || o.some(x => !x)) errs.push(lab + ': Option ঠিক নেই (অন্তত ২টা A) B) …, মাঝে ফাঁকা নয়)');
    else if(q.ans < 0 || q.ans >= o.length) errs.push(lab + ': ANS ভুল ("' + q.ansRaw + '")');
    else { const row = {q:q.q.trim(), o, a:q.ans, t:q.t.trim() || 'General', e:q.e.trim()}, be = bnErr(q.qb, q.ob, q.eb, o.length, row);
      if(be) errs.push(lab + ': ' + be); else ex.rows.push(row); }
    q = null; field = null;
  };
  const add = (k, s) => { const j = (a, x) => a + (a ? '\n' : '') + x;
    if(k === 'q' || k === 'e' || k === 'qb' || k === 'eb') q[k] = j(q[k], s); else if(typeof k === 'number') q.o[k] = j(q.o[k], s); else if(/^b\d$/.test(k)) q.ob[+k[1]] = j(q.ob[+k[1]], s); };
  for(const raw of lines){
    const L = raw.trim();
    if(/^```/.test(L)) continue;                                   // code fence
    let m;
    if((m = L.match(/^#\s*EXAM\s*:\s*(.*)$/i))){
      finish(); const c = m[1].trim().toUpperCase();
      if(!/^[A-Z0-9_-]{1,30}$/.test(c)){ errs.push('Exam code "' + m[1].trim() + '" ভুল — শুধু A-Z, 0-9, - _ (space নয়)'); ex = null; continue; }
      ex = exams[c] = exams[c] || {code:c, title:c, minutes:'10', neg:'0', open:'YES', rows:[], raw:{}}; qn = 0; field = null; continue;
    }
    if(/^##\s*Q/i.test(L)){ finish(); qn++; q = {n:(L.match(/\d+/) || [qn])[0], q:'', o:[], ans:-1, ansRaw:'', t:'', e:'', bn:false, qb:'', ob:[], eb:''}; field = null; continue; }
    if(!q && ex && (m = L.match(/^(MAXATTEMPTS|MAX ATTEMPTS|GUEST|START|END|INTRO)\s*:\s*(.*)$/i))){
      const k = m[1].toUpperCase().replace(' ', ''); ex.raw[k] = m[2].trim(); field = k === 'INTRO' ? 'intro' : null; continue;
    }
    if(!q && ex && (m = L.match(/^(TITLE|MINUTES|NEG|OPEN)\s*:\s*(.*)$/i))){
      const k = m[1].toUpperCase(), v = m[2].trim(); field = null;
      if(k === 'TITLE') ex.title = v || ex.code; else if(k === 'MINUTES') ex.minutes = v || '10'; else if(k === 'NEG') ex.neg = v || '0'; else ex.open = v.toUpperCase() === 'NO' ? 'NO' : 'YES';
      continue;
    }
    if(!q && ex && field === 'intro'){ ex.raw.INTRO += (ex.raw.INTRO ? '\n' : '') + L; continue; }
    if(!q) continue;                                               // প্রশ্নের বাইরের লেখা (⚠ CHECK ইত্যাদি) বাদ
    if(/^(\[\s*(BN|বাংলা|BANGLA|BENGALI)\s*\]|(BN|বাংলা|BANGLA|BENGALI)\s*:|-{2,}\s*(BN|বাংলা|BANGLA|BENGALI)\s*-{2,})$/i.test(L)){ q.bn = true; field = null; continue; }   // এরপর থেকে বাংলা version
    if((m = L.match(/^TOPIC\s*:\s*(.*)$/i))){ if(!q.bn) q.t = m[1]; field = null; continue; }
    if((m = L.match(/^Q\s*[:.)]\s*(.*)$/i))){ if(q.bn){ q.qb = m[1]; field = 'qb'; } else { q.q = m[1]; field = 'q'; } continue; }
    if((m = L.match(/^\(?([A-E])\s*[).]\s*(.*)$/))){ const i = 'ABCDE'.indexOf(m[1]), arr = q.bn ? q.ob : q.o; while(arr.length < i) arr.push(''); arr[i] = m[2]; field = q.bn ? 'b' + i : i; continue; }
    if((m = L.match(/^(ANS|ANSWER)\s*:\s*\(?([A-Za-z]?)\)?/i))){ if(q.bn){ field = null; continue; } q.ansRaw = m[2]; q.ans = 'ABCDE'.indexOf(m[2].toUpperCase()); if(!m[2]) q.ans = -1; field = null; continue; }
    if((m = L.match(/^(SOL|SOLUTION|EXPLANATION)\s*:\s*(.*)$/i))){ if(q.bn){ q.eb = m[2]; field = 'eb'; } else { q.e = m[2]; field = 'e'; } continue; }
    if(!L){ if(['q', 'e', 'qb', 'eb'].includes(field)) add(field, ''); continue; }
    if(field !== null) add(field, L);
  }
  finish();
  Object.values(exams).forEach(e => { e.ov = readRules(e.raw, e.code, errs); e.raw.INTRO != null && (e.ov.intro = e.ov.intro.replace(/\n+$/, '')); delete e.raw; });
  Object.values(exams).forEach(e => { if(!e.rows.length && !errs.length) errs.push(e.code + ': কোনো valid question পাওয়া যায়নি'); });
  if(!Object.keys(exams).length && !errs.length) errs.push('কোনো exam পাওয়া যায়নি — "# EXAM: CODE" লাইন আছে কিনা দেখো');
  Object.values(exams).forEach(e => e.rows.forEach(r => ['q', 'e', 'qb', 'eb'].forEach(k => { if(typeof r[k] === 'string') r[k] = r[k].replace(/\n{3,}/g, '\n\n'); })));
  return {errors:errs, exams};
}

async function changePass(){

  for(let i = 0; i < 6; i++){
    await sleep(1300);
    try{ const r = await (await fetch(CONFIG.SCRIPT_URL + '?action=tlogin&key=' + encodeURIComponent(a) + '&t=' + Date.now())).json(); if(r && r.ok){ SESS.key = a; LS.set('mq_sess', SESS); saveMsg = '✅ Password বদলেছে'; return render(true); } }catch(e){}

function rset(i, k, v){ ROSTER[i][k] = v; DIRTY = true; saveMsg = ''; const m = document.getElementById('dirty'); if(m) m.textContent = '● unsaved changes'; }
function radd(){ ROSTER.push({id:'', name:'', pin:'', blocked:false}); DIRTY = true; render(true); }
function rdel(i){ ROSTER.splice(i, 1); DIRTY = true; render(true); }
function rbulk(){
  const t = ($('#bulk') || {}).value || '';
  t.split('\n').forEach(l => {
    const p = l.split(/[,\t;]/).map(x => x.trim());
    if(!p[0]) return;
    const ex = ROSTER.find(r => norm(r.id) === norm(p[0]));
    if(ex){ ex.pin = p[1] || ex.pin; ex.name = p[2] || ex.name; } else ROSTER.push({id:p[0], pin:p[1] || '', name:p[2] || '', blocked:false});
  });
  DIRTY = true; render(true);
}
function rgen(){
  ROSTER.forEach(r => { if(!String(r.pin || '').trim()) r.pin = String(Math.floor(1000 + Math.random() * 9000)); });
  DIRTY = true; saveMsg = ''; render(true);
}
function rfromAttempts(){
  const seen = {};
  allRecs().forEach(r => { seen[norm(r.sid)] = r.name; });
  Object.entries(seen).forEach(([id, name]) => { if(!ROSTER.find(r => norm(r.id) === id)) ROSTER.push({id, name, pin:'', blocked:false}); });
  DIRTY = true; render(true);
}

function exportCSV(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = ['Date,SID,Name,Exam,Mode,Score,Total,Percent,Seconds'].concat(allRecs().map(r =>
    [new Date(aidTime(r.aid)).toLocaleString(), r.sid, r.name, r.exam, r.mode, r.score, r.total, pct(r), r.secs].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = 'results.csv'; document.body.appendChild(a); a.click(); a.remove();
}

      <span><button class="btn sm ghost" onclick="edMove(${i},-1)">↑</button> <button class="btn sm ghost" onclick="edMove(${i},1)">↓</button> <button class="btn sm ghost" onclick="edDup(${i})">⎘</button> <button class="btn sm ghost" onclick="edDel(${i})">🗑</button></span></div>
      <textarea rows="2" placeholder="Question (math: $x^2$ বা $\\dfrac{1}{2}$)" oninput="eset(${i},'q',this.value)">${escT(q.q)}</textarea>
      ${q.o.map((o, n) => `<div class="oe"><input type="radio" name="a${i}" ${q.a === n ? 'checked' : ''} onchange="eset(${i},'a',${n})" title="সঠিক উত্তর"><b>${LET[n]}</b><input type="text" value="${eA(o)}" placeholder="Option ${LET[n]}" oninput="eopt(${i},${n},this.value)"></div>`).join('')}
      <div class="row" style="margin:2px 0"><span><button class="btn sm ghost" onclick="edOpt(${i},true)">+ option</button> <button class="btn sm ghost" onclick="edOpt(${i},false)">− option</button></span><small class="muted">● = সঠিক উত্তর</small></div>
      <div class="g2"><input placeholder="Topic" value="${eA(q.t)}" oninput="eset(${i},'t',this.value)"></div>
      <textarea rows="3" placeholder="Explanation / solution (ঐচ্ছিক)" oninput="eset(${i},'e',this.value)">${escT(q.e)}</textarea>
      <details class="bnx" ${String(q.qb || '').trim() ? 'open' : ''}><summary>🇧🇩 বাংলা version ${String(q.qb || '').trim() ? '✓' : '(নেই — ঐচ্ছিক)'}</summary>
        <textarea rows="2" placeholder="বাংলা প্রশ্ন" oninput="eset(${i},'qb',this.value)">${escT(q.qb || '')}</textarea>
        ${q.o.map((o, n) => `<div class="oe"><b>${LET[n]}</b><input type="text" value="${eA((q.ob || [])[n] || '')}" placeholder="বাংলা option ${LET[n]} (ফাঁকা = English-টাই দেখাবে)" oninput="eoptb(${i},${n},this.value)"></div>`).join('')}
        <textarea rows="2" placeholder="বাংলা solution (ঐচ্ছিক)" oninput="eset(${i},'eb',this.value)">${escT(q.eb || '')}</textarea></details>
      <div class="pv" id="pv${i}"></div></div>`).join('');
  return head + qs + `<button class="btn ghost full" onclick="edAdd()">+ Add question</button>
    ${x.msg ? `<div class="warn">${esc(x.msg)}</div>` : ''}
    <div class="savebar"><button class="btn full" onclick="saveExam()">💾 Save exam ${DIRTY ? '+ settings' : ''}</button><div class="err" style="text-align:center" id="edmsg">${x.dirty ? '● unsaved' : ''}</div></div>`;
}
async function saveExam(){
  const x = EDX, errs = [];
  const rows = x.qs.map((q, i) => {
    let o = q.o.map(s => String(s).trim()); while(o.length && !o[o.length - 1]) o.pop();
    if(!String(q.q).trim()) errs.push('Q' + (i + 1) + ': question লেখা নেই');
    else if(o.length < 2 || o.some(s => !s)) errs.push('Q' + (i + 1) + ': অন্তত ২টা option লাগবে (মাঝে ফাঁকা নয়)');
    else if(q.a >= o.length) errs.push('Q' + (i + 1) + ': সঠিক উত্তর খালি option-এ');
    const row = {q:String(q.q).trim(), o, a:q.a, t:String(q.t).trim() || 'General', e:String(q.e || '').trim()};
    const be = bnErr(q.qb, (q.ob || []).slice(0, o.length), q.eb, o.length, row);
    if(be) errs.push('Q' + (i + 1) + ': ' + be);
    return row;
  });
  if(errs.length){ x.msg = errs.slice(0, 8).join(' · '); return render(true); }
  const old = x.code, nc = String(x.newCode == null ? old : x.newCode).trim().toUpperCase();
  if(nc !== old){
    if(!/^[A-Z0-9_-]{1,30}$/.test(nc)){ x.msg = 'Exam code-এ শুধু A-Z, 0-9, - _ চলবে (সর্বোচ্চ ৩০ অক্ষর, space নয়)'; return render(true); }
    x.msg = 'Code check করা হচ্ছে…'; render(true);
    const taken = await exGet(nc);
    if(taken === null){ x.msg = 'Network সমস্যা — আবার চেষ্টা করো।'; return render(true); }
    if(taken){ x.msg = '"' + nc + '" নামে আরেকটা exam আগে থেকেই আছে — অন্য code দাও।'; return render(true); }
    if(!x.isNew){
      x.msg = 'Code বদলানো হচ্ছে…'; render(true);
      await tPost({action:'rename', code:old, newcode:nc});
      let done = false;
      for(let i = 0; i < 6 && !done; i++){ await sleep(1500); done = (await exGet(nc)) === true && (await exGet(old)) === false; }
      if(!done){ x.msg = '⚠ Code বদলানো confirm হয়নি (backend Code.gs deploy/password দেখো)'; return render(true); }
      LS.set('mq_local', LS.get('mq_local', []).map(r => r.exam === old ? {...r, exam:nc} : r));
      delete EXAMS[old]; LS.set('mq_exams', EXAMS);
    }
    // এই exam-এর আলাদা rules নতুন code-এ সরাও
    if(CD && CD.exams && CD.exams[old]){ CD.exams[nc] = CD.exams[old]; delete CD.exams[old]; DIRTY = true; CFG = deepMerge(DEF_CFG, CD); }
    x.code = nc; x.newCode = nc;
    if(!x.isNew){ await loadRemote(); }
  }
  x.msg = 'Saving…'; render(true);
  const ex = {code:x.code, title:x.title || x.code, minutes:String(x.minutes || 10), neg:String(x.neg || 0), open:x.open ? 'YES' : 'NO', rows};
  await tPost({action:'upload', code:ex.code, rows:JSON.stringify(rowsOf(ex))});
  const ok = await verifyExam(ex);
  if(ok){ x.dirty = false; x.msg = '✅ Exam saved'; delete EXAMS[ex.code]; LS.set('mq_exams', EXAMS); await loadExamList(); if(DIRTY) await saveAll(); }
  else x.msg = '⚠ Save confirm হয়নি (Code.gs / password দেখো)';
  render(true);
}
/* ============================================================
   Boot
   ============================================================ */
function boot(){
  applyTheme();
  if(SESS){
    view = SESS.teacher ? 'teacher' : 'home';
    if(RUN && !SESS.teacher && RUN.sid === SESS.sid && EXAMS[RUN.exam]){ RUN.last = Date.now(); view = 'quiz'; }
    else if(RUN){ RUN = null; LS.del('mq_run'); }
  } else { RUN = null; }
  render();
  if(view === 'quiz') startTimer();
  if(!SESS) loadCfg().then(ok => { const f = document.querySelector('#sid'), t = document.querySelector('#tp'); if(ok && view === 'login' && !(f && f.value) && !(t && t.value)) render(true); });
  else if(view !== 'quiz') refresh(); else flush();
}
if(typeof document !== 'undefined' && document.getElementById('app') && !window.__TEST__) boot();
</script>
